<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام تثبيت الطلبات</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142b53;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:24px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #1b365012;margin-bottom:20px}h2{margin-top:0}label{display:block;font-weight:bold;margin:14px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}textarea{min-height:90px}button{background:#1767d2;border:0;border-radius:10px;color:white;padding:12px 20px;cursor:pointer;font:inherit;font-weight:bold}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#475569}.danger{background:#c53030}.hidden{display:none!important}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs button{flex:1}.muted{color:#64748b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.full{grid-column:1/-1}.orders{display:grid;gap:14px}.order{border:1px solid #dce4ef;border-radius:14px;padding:16px;display:grid;grid-template-columns:110px 1fr;gap:16px}.order img{width:110px;height:110px;object-fit:cover;border-radius:10px}.order p{margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.actions select{max-width:190px}.message{padding:12px;border-radius:9px;margin:12px 0;background:#eaf2ff}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}#preview{max-width:160px;max-height:160px;object-fit:contain;margin-top:10px;border-radius:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}.order{grid-template-columns:1fr}.order img{width:100%;height:200px}}
</style></head><body>
<header><h1>📦 نظام تثبيت الطلبات</h1><span>إدارة طلباتك بسهولة</span></header>
<main class="wrap"><div class="tabs"><button id="newTab">إضافة طلب</button><button id="adminTab" class="secondary">لوحة الإدارة</button></div>
<section id="newSection" class="card"><h2>تثبيت طلب جديد</h2><form id="orderForm"><div class="grid"><div><label for="name">اسم الزبون *</label><input id="name" required maxlength="120"></div><div><label for="phone">رقم الزبون *</label><input id="phone" required inputmode="tel" pattern="[0-9+\- ]{7,20}" title="أدخل رقم هاتف صحيح" maxlength="20"></div><div class="full"><label for="address">العنوان الكامل *</label><textarea id="address" required maxlength="1000" placeholder="المحافظة، المنطقة، أقرب نقطة دالة"></textarea></div><div class="full"><label for="notes">ملاحظات</label><textarea id="notes" maxlength="2000" placeholder="لون المنتج، العدد، تفاصيل إضافية..."></textarea></div><div class="full"><label for="photo">صورة الطلب *</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp" required><img id="preview" class="hidden" alt="معاينة الصورة"><p class="muted">JPG / PNG / WEBP — الحد الأقصى 5 ميغابايت</p></div></div><button id="saveBtn" type="submit">تثبيت الطلب</button><div id="formMessage" role="status"></div></form></section>
<section id="adminSection" class="hidden"><div id="loginBox" class="card"><h2>دخول الإدارة</h2><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><p><button>تسجيل الدخول</button></p><div id="loginMessage" role="status"></div></form></div><div id="dashboard" class="hidden"><div class="card"><div class="actions" style="justify-content:space-between"><h2>الطلبات المسجلة</h2><button id="logoutBtn" class="secondary">تسجيل الخروج</button></div><p id="count"></p><input id="search" placeholder="بحث بالاسم أو رقم الهاتف أو رقم الطلب"><div id="adminMessage" role="status"></div></div><div id="orders" class="orders"></div></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// ضع بيانات مشروع Supabase هنا (مفتاح publishable/anon فقط، وليس service_role)
const SUPABASE_URL='https://fqqbqeopisbrcfpjkfad.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_NK20CJCn-y62ySKqD-Lsrg_YqBBJLqg';
const configured=!SUPABASE_URL.startsWith('YOUR_')&&!SUPABASE_ANON_KEY.startsWith('YOUR_');
const db=configured?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const showMessage=(id,msg,type='error')=>{$(id).textContent=msg;$(id).className=msg?'message '+type:''};
function switchTab(admin){$('newSection').classList.toggle('hidden',admin);$('adminSection').classList.toggle('hidden',!admin);$('newTab').className=admin?'secondary':'';$('adminTab').className=admin?'':'secondary';if(admin)refreshAuth()}
$('newTab').onclick=()=>switchTab(false);$('adminTab').onclick=()=>switchTab(true);
$('photo').onchange=()=>{const f=$('photo').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}else $('preview').classList.add('hidden')};
$('orderForm').onsubmit=async e=>{e.preventDefault();if(!db)return showMessage('formMessage','أكمل إعداد Supabase أولاً.');const f=$('photo').files[0];if(!f||f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))return showMessage('formMessage','اختَر صورة JPG أو PNG أو WEBP بحجم أقل من 5 ميغابايت.');$('saveBtn').disabled=true;showMessage('formMessage','جاري حفظ الطلب...','');try{const extension={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];const path=`${crypto.randomUUID()}.${extension}`;const upload=await db.storage.from('order-images').upload(path,f,{contentType:f.type,upsert:false});if(upload.error)throw upload.error;const {data,error}=await db.rpc('submit_order',{p_name:$('name').value.trim(),p_phone:$('phone').value.trim(),p_address:$('address').value.trim(),p_notes:$('notes').value.trim(),p_image_path:path});if(error)throw error;$('orderForm').reset();$('preview').classList.add('hidden');showMessage('formMessage',`تم تثبيت الطلب بنجاح! رقم الطلب: ${data}`,'ok')}catch(err){showMessage('formMessage',err.message||'تعذر حفظ الطلب')}finally{$('saveBtn').disabled=false}};
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!db)return showMessage('loginMessage','أكمل إعداد Supabase أولاً.');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return showMessage('loginMessage','فشل تسجيل الدخول. تحقق من البيانات.');$('password').value='';refreshAuth()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();refreshAuth()};
async function refreshAuth(){if(!db)return showMessage('loginMessage','أكمل إعداد Supabase أولاً.');const {data:{user}}=await db.auth.getUser();$('loginBox').classList.toggle('hidden',!!user);$('dashboard').classList.toggle('hidden',!user);if(user)await loadOrders()}
let allOrders=[];
async function loadOrders(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(500);if(error)return showMessage('adminMessage','لا يمكن تحميل الطلبات: '+error.message);allOrders=data||[];renderOrders()}
function el(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function renderOrders(){const q=$('search').value.trim().toLowerCase();const list=allOrders.filter(o=>[o.id,o.customer_name,o.phone].some(x=>String(x??'').toLowerCase().includes(q)));$('count').textContent=`عدد الطلبات المعروضة: ${list.length} (آخر 500 طلب كحد أقصى)`;$('orders').replaceChildren();if(!list.length){$('orders').append(el('p','لا توجد طلبات مطابقة'));return}for(const o of list){const card=document.createElement('article');card.className='card order';const img=document.createElement('img');img.alt='صورة الطلب';img.loading='lazy';const body=document.createElement('div');for(const [k,v] of [['رقم الطلب',o.id],['الاسم',o.customer_name],['الهاتف',o.phone],['العنوان',o.address],['الملاحظات',o.notes||'لا توجد'],['التاريخ',new Date(o.created_at).toLocaleString('ar-IQ')]])body.append(el('p',`${k}: ${v}`));const actions=document.createElement('div');actions.className='actions';const select=document.createElement('select');for(const s of ['جديد','قيد التجهيز','تم التوصيل','ملغي']){const opt=new Option(s,s);select.add(opt)}select.value=o.status;select.onchange=async()=>{const {error}=await db.from('orders').update({status:select.value}).eq('id',o.id);if(error){alert(error.message);select.value=o.status}else o.status=select.value};const del=el('button','حذف الطلب');del.className='danger';del.onclick=async()=>{if(!confirm('متأكد من حذف هذا الطلب؟'))return;const {error}=await db.from('orders').delete().eq('id',o.id);if(error)return alert(error.message);await db.storage.from('order-images').remove([o.image_path]);await loadOrders()};actions.append(select,del);body.append(actions);card.append(img,body);$('orders').append(card);db.storage.from('order-images').createSignedUrl(o.image_path,3600).then(({data})=>{if(data?.signedUrl)img.src=data.signedUrl})}}
$('search').oninput=renderOrders;
</script></body></html>
